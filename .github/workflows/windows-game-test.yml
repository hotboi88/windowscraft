# The real game on a real Windows machine: Minecraft (software OpenGL), the real in-game monitor
# helper and the real Parsec driver — U on a wall, a gaming monitor block, a joined monitor,
# sitting down, a tablet, breaking a wall (src/testmod/.../WinGameTest.java). The game's log
# and screenshots are attached to each run.
name: Windows game test

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'src/main/resources/windowscraft/natives/**'
      - 'src/main/java/dev/windowscraft/monitor/**'
      - 'src/main/java/dev/windowscraft/capture/**'
      - '.github/workflows/windows-game-test.yml'
      - 'src/main/java/**'
      - 'src/testmod/java/dev/windowscraft/autotest/WinGameTest.java'
      - 'tools/wintest/**'
  workflow_dispatch:

jobs:
  game:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install the Parsec virtual display driver
        shell: pwsh
        run: |
          Invoke-WebRequest https://builds.parsec.app/vdd/parsec-vdd-0.41.0.0.exe -OutFile "$env:RUNNER_TEMP\vdd.exe"
          $p = Start-Process "$env:RUNNER_TEMP\vdd.exe" -ArgumentList '/S' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 5
          exit 0

      - name: Software OpenGL for the game (Mesa llvmpipe)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pal1000/mesa-dist-win --pattern '*release-msvc.7z' --dir "$env:RUNNER_TEMP\mesa-dl"
          $a = Get-ChildItem "$env:RUNNER_TEMP\mesa-dl\*.7z" | Select-Object -First 1
          "Mesa: $($a.Name)"
          7z x $a.FullName "-o$env:RUNNER_TEMP\mesa" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\mesa\x64\*.dll" "$env:JAVA_HOME\bin\"
          Get-ChildItem "$env:JAVA_HOME\bin\opengl32.dll"

      - name: The test world
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path run-wintest\saves\wintest | Out-Null
          Copy-Item tools\wintest\level.dat run-wintest\saves\wintest\level.dat
          Copy-Item tools\wintest\options.txt run-wintest\options.txt

      - name: Game test
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          gradle runWintest --no-daemon --console=plain
          $log = Get-Content run-wintest\logs\latest.log -ErrorAction SilentlyContinue
          $log | Select-String "\[wintest\]|\[wc-vdisplay\]|In-game monitor|WARN|ERROR" | ForEach-Object { $_.Line }
          if (-not ($log | Select-String "WINTEST PASSED")) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game
          path: |
            run-wintest/logs/
            run-wintest/screenshots/
            run-wintest/crash-reports/
