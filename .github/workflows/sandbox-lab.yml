# Measures exactly which programs a Sandboxie rule takes (tools/sandbox/lab.ps1): facts first,
# before own copies of apps are built on them.
name: Sandbox lab

on:
  workflow_dispatch:

jobs:
  lab:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download Sandboxie-Plus
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\sbie" | Out-Null
          gh release download -R sandboxie-plus/Sandboxie -p "Sandboxie-Plus-x64-v*.exe" -D "$env:RUNNER_TEMP\sbie"
          Get-ChildItem "$env:RUNNER_TEMP\sbie"
      - name: Lab
        shell: pwsh
        timeout-minutes: 20
        run: tools/sandbox/lab.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-lab
          path: out/
