# Watching a movie on someone else's screen over an imitation home internet link (limited
# bandwidth, a router queue, delay, jitter, a little loss): how often the picture pauses, how
# long, and how many pictures show damage. Each variant on its own machine.
name: Movie over a home link

on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/dev/windowscraft/stream/**'
      - 'src/main/java/dev/windowscraft/relay/**'
      - 'src/testmod/java/dev/windowscraft/autotest/MultiplayerTest.java'
      - 'tools/movie/**'
      - '.github/workflows/movie-test.yml'
  workflow_dispatch:

jobs:
  movie:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        link:
          - { name: good, cfg: "8000 150 20 5 0.001" }
          - { name: typical, cfg: "4500 100 30 15 0.005" }
          - { name: weak, cfg: "3200 80 45 25 0.01" }
        freeze: ["true", "false"]
    name: movie (${{ matrix.link.name }}, freeze ${{ matrix.freeze }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Display and build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          nproc
          gradle build -x test --no-daemon -q
          gradle downloadAssets --no-daemon -q
      - name: Movie
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          DISPLAY=:99 GRADLE_FLAGS= OUT=build/movie tools/movie/run.sh "${{ matrix.link.cfg }} ${{ matrix.freeze }}" "${{ matrix.link.name }}-freeze-${{ matrix.freeze }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movie-${{ matrix.link.name }}-freeze-${{ matrix.freeze }}
          path: build/movie/
