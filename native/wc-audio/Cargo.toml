[package]
name = "wc-audio"
version = "0.4.2"
edition = "2021"
description = "WindowsCraft audio capture helper: WASAPI application loopback to raw PCM on stdout"
license = "LGPL-3.0-or-later"

[[bin]]
name = "wc-audio"
path = "src/main.rs"

[[bin]]
name = "wc-capture"
path = "src/bin/wc-capture.rs"

[[bin]]
name = "wc-input"
path = "src/bin/wc-input.rs"

[[bin]]
name = "wc-vdisplay"
path = "src/bin/wc-vdisplay.rs"

[[bin]]
name = "wc-apps"
path = "src/bin/wc-apps.rs"

[dependencies]
wasapi = "0.25"
# wc-input: a virtual Xbox controller per person using your screens (through ViGEmBus, if installed)
vigem-client = "0.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading",
    "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
    "Win32_Graphics_OpenGL", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm",
    "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_System_SystemServices", "Win32_System_Ole", "Win32_System_Memory", "Win32_Security", "Win32_System_DataExchange",
    "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_System_SystemInformation", "Win32_Devices_Display"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
